kind = "web"
previewPath = "/"
title = "Dietitian Website"
version = "1.0.0"
id = "artifacts/dietitian-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21725

[services.development]
run = "pnpm --filter @workspace/dietitian-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dietitian-site", "run", "build" ]
publicDir = "artifacts/dietitian-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21725"
BASE_PATH = "/"
